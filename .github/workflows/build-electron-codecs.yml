name: Build Electron with media codecs

# Linux x64. Build jest dzielony na etapy (stage.yml), bo pojedynczy job na
# darmowym runnerze ma limit 6 h, a cały Electron kompiluje się dłużej.
# Etapy uruchamiają się po kolei; każdy kolejny startuje tylko wtedy,
# gdy poprzedni nie skończył. Gotowy zip: artefakt electron-linux-<tag>.

on:
  workflow_dispatch:
    inputs:
      electron_version:
        description: 'Tag Electron (musi mieć patches/<tag> w repo patchy)'
        required: true
        default: 'v42.4.0'
      patches_repo:
        description: 'Repo z katalogiem patches/<tag>'
        required: true
        default: '5rahim/electron-media-patch'

permissions:
  contents: read
  actions: read

jobs:
  s1:
    uses: ./.github/workflows/stage.yml
    with: { stage: 1, electron_version: '${{ inputs.electron_version }}', patches_repo: '${{ inputs.patches_repo }}' }
  s2:
    needs: s1
    if: ${{ needs.s1.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { stage: 2, electron_version: '${{ inputs.electron_version }}', patches_repo: '${{ inputs.patches_repo }}' }
  s3:
    needs: s2
    if: ${{ needs.s2.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { stage: 3, electron_version: '${{ inputs.electron_version }}', patches_repo: '${{ inputs.patches_repo }}' }
  s4:
    needs: s3
    if: ${{ needs.s3.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { stage: 4, electron_version: '${{ inputs.electron_version }}', patches_repo: '${{ inputs.patches_repo }}' }
  s5:
    needs: s4
    if: ${{ needs.s4.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { stage: 5, electron_version: '${{ inputs.electron_version }}', patches_repo: '${{ inputs.patches_repo }}' }
  s6:
    needs: s5
    if: ${{ needs.s5.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { stage: 6, electron_version: '${{ inputs.electron_version }}', patches_repo: '${{ inputs.patches_repo }}' }
  s7:
    needs: s6
    if: ${{ needs.s6.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { stage: 7, electron_version: '${{ inputs.electron_version }}', patches_repo: '${{ inputs.patches_repo }}' }
  s8:
    needs: s7
    if: ${{ needs.s7.outputs.done != 'true' }}
    uses: ./.github/workflows/stage.yml
    with: { stage: 8, electron_version: '${{ inputs.electron_version }}', patches_repo: '${{ inputs.patches_repo }}' }
